name: Initialize project tracking

# Run this once, by hand, from the Actions tab of your own copy of the
# template: Actions -> "Initialize project tracking" -> "Run workflow".
#
# It is safe to run again -- existing milestones, labels and issues are left
# alone -- so re-run it if the deadlines below need to change.
#
# NOTE: this is deliberately not triggered by `fork`. That event fires on the
# *upstream* template repository, not on the new copy, so it would have created
# the issues in the instructor's repository instead of the student's.

# Deadlines are Toronto local time (23:59 on the due date), written with an
# explicit UTC offset: -04:00 while daylight time is in effect, -05:00 after it
# ends on the first Sunday of November. Keep the offset on the local date rather
# than converting to Z -- 23:59 Toronto is the *next* day in UTC, and GitHub
# renders a milestone due date as a plain date, which would show a day late.

on:
  workflow_dispatch:
    inputs:
      m1_due:
        description: "Milestone 1 deadline (ISO 8601, with offset)"
        required: true
        default: "2026-10-18T23:59:59-04:00"
      m2_due:
        description: "Milestone 2 deadline (ISO 8601, with offset)"
        required: true
        default: "2026-11-15T23:59:59-05:00"
      final_due:
        description: "Final delivery deadline (ISO 8601, with offset)"
        required: true
        default: "2026-12-10T23:59:59-05:00"

permissions:
  issues: write
  contents: read

# Two people pressing "Run workflow" at once would otherwise race and could
# create the same issue twice.
concurrency:
  group: init-tracking
  cancel-in-progress: false

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create milestones, labels and section issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:      ${{ github.repository }}
          M1_DUE:    ${{ inputs.m1_due }}
          M2_DUE:    ${{ inputs.m2_due }}
          FINAL_DUE: ${{ inputs.final_due }}
        run: .github/scripts/init-tracking.sh
